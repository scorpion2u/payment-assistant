  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    *:focus{outline:none;} *:focus-visible{outline:2px solid #999;outline-offset:2px;}
    body{
      font-family:'Inter',system-ui;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:16px;
    }
    .app{
      width:100%;max-width:440px;border-radius:32px;padding:20px;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:20px 20px 40px rgba(0,0,0,0.15),-15px -15px 35px rgba(255,255,255,0.9);
    }
    .header-card{
      display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:26px;margin-bottom:14px;
      background:linear-gradient(145deg,#e8edf3,#d2d8e4);box-shadow:12px 12px 24px rgba(0,0,0,0.12),-8px -8px 20px rgba(255,255,255,0.9);
    }
    .header-left{display:flex;align-items:center;gap:12px;}
    .app-title{font-weight:700;font-size:1.2rem;}
    .summary-row{display:flex;gap:10px;margin-bottom:14px;}
    .summary-card{flex:1;padding:12px 14px;border-radius:22px;box-shadow:8px 8px 16px rgba(0,0,0,0.1),-6px -6px 14px rgba(255,255,255,0.9);display:flex;flex-direction:column;gap:4px;}
    .summary-card.unpaid-card{background:linear-gradient(145deg,#fef5f5,#fce4e4);}
    .summary-card.paid-card{background:linear-gradient(145deg,#f5fdf7,#d4edda);}
    .summary-card-label{font-size:0.75rem;font-weight:600;opacity:0.7;display:flex;align-items:center;gap:6px;}
    .summary-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .summary-dot.red{background:#e07b7b;}.summary-dot.green{background:#8fcf91;}
    .summary-card-amount{font-size:1.15rem;font-weight:800;color:#2c3e50;}
    .status-badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:0.65rem;font-weight:600;margin-left:6px;}
    .status-badge.paid{background:#d4edda;color:#155724;}
    .status-badge.unpaid{background:#f8d7da;color:#721c24;}
    .btn{
      border:none;border-radius:20px;padding:10px 18px;cursor:pointer;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:6px 6px 12px rgba(0,0,0,0.12),-6px -6px 12px rgba(255,255,255,0.9);transition:.2s;font-weight:600;user-select:none;
    }
    .btn:active{transform:scale(.96);box-shadow:inset 6px 6px 12px rgba(0,0,0,0.15),inset -6px -6px 12px rgba(255,255,255,0.8);}
    .btn.primary{width:42px;height:42px;padding:0;border-radius:50%;font-size:1.4rem;}
    .list{margin-top:10px;display:flex;flex-direction:column;gap:14px;}
    .bank-group{
      border-radius:22px;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:8px 8px 16px rgba(0,0,0,0.1),-6px -6px 14px rgba(255,255,255,0.9);overflow:hidden;
      transition: opacity 0.2s, transform 0.2s;
    }
    .bank-group.dragging {opacity: 0.6;}
    .bank-group.drag-over {box-shadow: 0 0 0 3px #2c3e50, 8px 8px 16px rgba(0,0,0,0.15);}
    .bank-handle {
      cursor: grab;font-size: 1.3rem;opacity: 0.4;padding: 0 6px;
      user-select: none;touch-action: none;flex-shrink:0;
    }
    .bank-handle:active {cursor: grabbing;}
    .bank-header{display:flex;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;gap:10px;}
    .bank-header-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
    .bank-icon{font-size:1.4rem;flex-shrink:0;}
    .bank-header-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
    .bank-name-row{display:flex;align-items:center;gap:8px;}
    .bank-name{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bank-total{font-weight:800;font-size:1rem;flex-shrink:0;margin-left:auto;}
    .bank-status-stats{display:flex;align-items:center;gap:6px;font-size:0.68rem;font-weight:600;}
    .bank-status-stats .stat-paid{color:#155724;background:#d4edda;padding:2px 8px;border-radius:10px;}
    .bank-status-stats .stat-unpaid{color:#721c24;background:#f8d7da;padding:2px 8px;border-radius:10px;}
    .bank-header-actions{display:flex;align-items:center;flex-shrink:0;margin-left:4px;}
    .collapse-arrow{
      font-size:0.6rem;opacity:0.5;transition:transform 0.3s;
      padding:10px 12px;flex-shrink:0;line-height:1;
    }
    .bank-group.expanded .collapse-arrow{transform:rotate(180deg);}
    .bank-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
    .bank-group.expanded .bank-body{max-height:2000px;}
    .bank-items{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;}
    .bank-items-footer{display:flex;gap:8px;margin-top:4px;}
    .btn-delete-bank{
      flex:1;padding:8px;border-radius:14px;border:none;cursor:pointer;
      background:linear-gradient(145deg,#fce4e4,#f5d0d0);color:#c0392b;
      box-shadow:2px 2px 4px rgba(0,0,0,0.06),-2px -2px 4px rgba(255,255,255,0.6);
      font-size:0.75rem;font-weight:600;transition:.2s;display:flex;align-items:center;justify-content:center;gap:4px;
    }
    .btn-delete-bank:active{transform:scale(.96);box-shadow:inset 2px 2px 4px rgba(0,0,0,0.12);}
    .bill-item{
      display:flex;align-items:center;padding:10px 14px;border-radius:18px;
      background:linear-gradient(145deg,#dfe4eb,#cfd5de);
      box-shadow:inset 2px 2px 4px rgba(0,0,0,0.06),inset -2px -2px 4px rgba(255,255,255,0.5);gap:8px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .bill-item.overdue{background:linear-gradient(145deg,#fce4e4,#f5d0d0);}
    .bill-item.dragging {opacity: 0.5;}
    .bill-item.drag-over {box-shadow: 0 0 0 2px #2c3e50, inset 2px 2px 4px rgba(0,0,0,0.06), inset -2px -2px 4px rgba(255,255,255,0.5);}
    .bill-handle {
      cursor: grab;font-size: 1rem;opacity: 0.35;padding: 0 4px;
      user-select: none;flex-shrink: 0;touch-action: none;
    }
    .bill-handle:active {cursor: grabbing;}
    .bill-info{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
    .bill-name{font-weight:700;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bill-amount{font-size:1rem;font-weight:800;}
    .bill-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .icon-btn{
      width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;
      background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:2px 2px 4px rgba(0,0,0,0.08),-2px -2px 4px rgba(255,255,255,0.8);transition:.2s;
      display:flex;align-items:center;justify-content:center;user-select:none;
    }
    .icon-btn:active{transform:scale(.9);box-shadow:inset 2px 2px 4px rgba(0,0,0,0.12),inset -2px -2px 4px rgba(255,255,255,0.6);}
    .icon-dot{width:14px;height:14px;border-radius:50%;transition:.2s;}
    .icon-dot.unpaid{background:#e07b7b;box-shadow:inset 2px 2px 3px rgba(0,0,0,0.15),inset -2px -2px 3px rgba(255,255,255,0.2);}
    .icon-dot.paid{background:#8fcf91;box-shadow:inset 2px 2px 3px rgba(0,0,0,0.12),inset -2px -2px 3px rgba(255,255,255,0.2);}
    .icon-edit{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:9px solid #9a9a9a;margin-left:1px;}
    .icon-del{width:12px;height:12px;position:relative;}
    .icon-del::before,.icon-del::after{content:"";position:absolute;top:50%;left:50%;width:1.5px;height:10px;background:#a0a0a0;border-radius:1px;}
    .icon-del::before{transform:translate(-50%,-50%) rotate(45deg);}
    .icon-del::after{transform:translate(-50%,-50%) rotate(-45deg);}
    .add-bill-btn{
      display:flex;align-items:center;justify-content:center;gap:4px;padding:10px;border-radius:16px;cursor:pointer;
      font-size:0.8rem;font-weight:600;color:#888;background:linear-gradient(145deg,#dfe4eb,#cfd5de);
      box-shadow:inset 2px 2px 4px rgba(0,0,0,0.04),inset -2px -2px 4px rgba(255,255,255,0.5);transition:.2s;user-select:none;
    }
    .add-bill-btn:active{box-shadow:inset 4px 4px 6px rgba(0,0,0,0.1),inset -4px -4px 6px rgba(255,255,255,0.6);}
    .empty-bank-hint{text-align:center;font-size:0.75rem;opacity:0.4;padding:8px 0;}
    .form-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:200;
      opacity:0;pointer-events:none;transition:opacity 0.3s;
    }
    .form-overlay.show{opacity:1;pointer-events:auto;}
    .form-panel{
      border-radius:28px;padding:24px 20px 20px;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:20px 20px 40px rgba(0,0,0,0.2),-12px -12px 30px rgba(255,255,255,0.9);
      max-width:360px;width:90%;display:flex;flex-direction:column;gap:12px;transform:scale(0.9);transition:transform 0.3s;
    }
    .form-overlay.show .form-panel{transform:scale(1);}
    .form-title{font-weight:700;font-size:0.9rem;color:#333;text-align:center;}
    .custom-select-wrapper{position:relative;display:block;user-select:none;}
    .custom-select-display{
      display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:18px;
      background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:inset 4px 4px 8px rgba(0,0,0,0.08),inset -4px -4px 8px rgba(255,255,255,0.7);
      font-weight:600;color:#333;cursor:pointer;font-size:0.95rem;transition:box-shadow 0.2s;font-family:inherit;
    }
    .custom-select-display.open{box-shadow:inset 6px 6px 12px rgba(0,0,0,0.12),inset -6px -6px 12px rgba(255,255,255,0.8)!important;}
    .custom-select-display .arrow{font-size:0.7rem;opacity:0.6;transition:transform 0.2s;}
    .custom-select-display.open .arrow{transform:rotate(180deg);}
    .custom-select-dropdown{
      position:absolute;top:calc(100% + 6px);left:0;right:0;background:#e8edf3;border-radius:18px;
      box-shadow:12px 12px 24px rgba(0,0,0,0.18),-8px -8px 20px rgba(255,255,255,0.95);
      z-index:100;display:none;overflow:hidden;padding:6px;
    }
    .custom-select-dropdown.open{display:block;}
    .custom-select-option{
      padding:10px 14px;cursor:pointer;font-weight:600;color:#333;font-size:0.95rem;border-radius:14px;
      transition:box-shadow 0.15s,background 0.15s;
    }
    .custom-select-option:hover{box-shadow:inset 2px 2px 5px rgba(0,0,0,0.08),inset -2px -2px 5px rgba(255,255,255,0.5);}
    .custom-select-option.selected{
      background:linear-gradient(145deg,#d0d7e0,#bcc2cb)!important;color:#333!important;
      box-shadow:inset 3px 3px 6px rgba(0,0,0,0.12),inset -3px -3px 6px rgba(255,255,255,0.6)!important;font-weight:700;
    }
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:300;
      opacity:0;pointer-events:none;transition:opacity 0.3s;
    }
    .modal-overlay.show{opacity:1;pointer-events:auto;}
    .modal-box{
      border-radius:28px;padding:24px 20px 20px;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:20px 20px 40px rgba(0,0,0,0.2),-12px -12px 30px rgba(255,255,255,0.9);
      max-width:320px;width:90%;text-align:center;transform:scale(0.9);transition:transform 0.3s;
    }
    .modal-overlay.show .modal-box{transform:scale(1);}
    .modal-icon{font-size:2.5rem;margin-bottom:12px;opacity:0.8;}
    .modal-message{font-weight:600;font-size:1rem;margin-bottom:20px;color:#333;line-height:1.5;}
    .modal-buttons{display:flex;gap:10px;}
    .modal-buttons .btn{flex:1;padding:12px;}
    .modal-buttons .btn.confirm-btn{color:#c0392b;font-weight:700;}
    .modal-buttons .btn.confirm-btn.primary-action{color:#2c7a4a;font-weight:700;}
    input{
      border:none;padding:12px;border-radius:18px;background:linear-gradient(145deg,#e8edf3,#d2d8e4);
      box-shadow:inset 4px 4px 8px rgba(0,0,0,0.08),inset -4px -4px 8px rgba(255,255,255,0.7);
      font-size:0.85rem;font-family:inherit;
    }
    .row-buttons{display:flex;gap:10px;margin-top:6px;}
    .row-buttons .btn{flex:1;}
    .empty-state{text-align:center;padding:30px 20px;border-radius:20px;}
    .empty-state-icon{font-size:3rem;margin-bottom:12px;opacity:0.4;}
    .empty-state-text{font-weight:600;opacity:0.5;margin-bottom:4px;}
    .empty-state-hint{font-size:0.8rem;opacity:0.35;}
    .toast{
      position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:24px;
      background:#2c3e50;color:#fff;font-size:0.85rem;font-weight:600;opacity:0;transition:opacity .3s;
      pointer-events:none;z-index:400;
    }
    .toast.show{opacity:1;}
    .menu-overlay {
      position: fixed;inset: 0;background: rgba(0,0,0,0.3);
      display: flex;align-items: center;justify-content: center;z-index: 350;
      opacity: 0;pointer-events: none;transition: opacity 0.3s;
    }
    .menu-overlay.show {opacity: 1;pointer-events: auto;}
    .menu-popup {
      border-radius: 28px;padding: 24px 20px 20px;
      background: linear-gradient(145deg, #e8edf3, #d2d8e4);
      box-shadow: 20px 20px 40px rgba(0,0,0,0.2), -12px -12px 30px rgba(255,255,255,0.9);
      max-width: 320px;width: 90%;display: flex;flex-direction: column;gap: 12px;
      transform: scale(0.9);transition: transform 0.3s;
    }
    .menu-overlay.show .menu-popup {transform: scale(1);}
    .menu-popup .btn {
      display: flex;align-items: center;justify-content: center;gap: 8px;
      padding: 14px 18px;font-size: 0.95rem;border-radius: 18px;
    }
    .tutorial-overlay {
      position: fixed;inset: 0;background: rgba(0,0,0,0.4);
      display: flex;align-items: center;justify-content: center;z-index: 400;
      opacity: 0;pointer-events: none;transition: opacity 0.3s;
    }
    .tutorial-overlay.show {opacity: 1;pointer-events: auto;}
    .tutorial-popup {
      border-radius: 28px;padding: 24px 20px 20px;
      background: linear-gradient(145deg, #e8edf3, #d2d8e4);
      box-shadow: 20px 20px 40px rgba(0,0,0,0.2), -12px -12px 30px rgba(255,255,255,0.9);
      max-width: 380px;width: 90%;max-height: 80vh;overflow-y: auto;
      text-align: left;transform: scale(0.9);transition: transform 0.3s;
    }
    .tutorial-overlay.show .tutorial-popup {transform: scale(1);}
  </style>
</head>
<body>

<div class="app">
  <div class="header-card">
    <div class="header-left">
      <div class="app-title">每月缴款</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn primary" id="addBankBtn" title="添加银行">＋</button>
      <button class="btn" id="menuBtn" title="菜单">☰</button>
    </div>
  </div>

  <div class="summary-row">
    <div class="summary-card unpaid-card">
      <div class="summary-card-label"><span class="summary-dot red"></span> 未缴合计 · <span id="unpaidCount">0</span>笔</div>
      <div class="summary-card-amount" id="unpaidAmount">RM 0.00</div>
    </div>
    <div class="summary-card paid-card">
      <div class="summary-card-label"><span class="summary-dot green"></span> 已缴合计 · <span id="paidCount">0</span>笔</div>
      <div class="summary-card-amount" id="paidAmount">RM 0.00</div>
    </div>
  </div>

  <div id="list" class="list"></div>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-popup">
      <button class="btn install-menu-btn" id="installAppBtn" style="display:none;">📱 安装应用</button>
      <button class="btn tutorial-btn" id="tutorialBtn">📖 安装到主屏幕</button>
      <button class="btn" id="exportBtn">📤 导出数据</button>
      <button class="btn" id="importBtn">📥 导入数据</button>
      <button class="btn" id="clearAllBtn" style="color:#c0392b;">🧹 清空所有数据</button>
      <button class="btn" id="menuCloseBtn" style="margin-top:4px;">关闭</button>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none;">

  <div class="tutorial-overlay" id="tutorialOverlay">
    <div class="tutorial-popup">
      <div class="form-title" style="margin-bottom:12px;">📖 如何安装到主屏幕</div>
      <div id="tutorialContent"></div>
      <button class="btn" id="tutorialCloseBtn" style="margin-top:12px;width:100%;">关闭</button>
    </div>
  </div>

  <div class="form-overlay" id="bankFormOverlay">
    <div class="form-panel">
      <div class="form-title">添加银行/服务机构/自动扣款...等等</div>
      <input id="bankNameInput" placeholder="银行名称（必填）">
      <div class="row-buttons">
        <button id="bankSaveBtn" class="btn">保存</button>
        <button id="bankCancelBtn" class="btn">取消</button>
      </div>
    </div>
  </div>

  <div class="form-overlay" id="billFormOverlay">
    <div class="form-panel">
      <div class="form-title">新增缴款</div>
      <input id="billNameInput" placeholder="费用名称（必填）">
      <input id="billAmountInput" type="number" placeholder="金额（必填）" step="0.01" min="0">
      <div class="custom-select-wrapper" id="statusSelectWrapper">
        <div class="custom-select-display" id="statusSelectDisplay">
          <span id="statusSelectText">未缴</span>
          <span class="arrow">▼</span>
        </div>
        <div class="custom-select-dropdown" id="statusSelectDropdown">
          <div class="custom-select-option selected" data-value="unpaid">未缴</div>
          <div class="custom-select-option" data-value="paid">已缴</div>
        </div>
      </div>
      <div class="row-buttons">
        <button id="billSaveBtn" class="btn">保存</button>
        <button id="billCancelBtn" class="btn">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon">⚠️</div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-buttons">
        <button class="btn cancel-btn" id="modalCancel">取消</button>
        <button class="btn confirm-btn" id="modalConfirm">确认</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
var STORAGE_KEY = 'monthly_bank_data_v4';
var data = { banks: [], bills: [] };
var nextBankId = 1, nextBillId = 1;
var editingBillId = null, editingBankId = null;
var currentBillStatus = 'unpaid', currentBankId = null;
var expandedBanks = {};

var draggedItem = null, draggedItemType = null, draggedItemId = null, draggedItemBankId = null, dragOverItem = null;
var touchStartY = 0, touchStartX = 0;
var touchDraggedItem = null, touchDraggedItemType = null, touchDraggedItemId = null, touchDraggedItemBankId = null;
var touchClone = null, touchStartElement = null, touchHasMoved = false;

var listEl = document.getElementById('list');
var toast = document.getElementById('toast');
var bankFormOverlay = document.getElementById('bankFormOverlay');
var bankNameInput = document.getElementById('bankNameInput');
var bankSaveBtn = document.getElementById('bankSaveBtn');
var bankCancelBtn = document.getElementById('bankCancelBtn');
var billFormOverlay = document.getElementById('billFormOverlay');
var billNameInput = document.getElementById('billNameInput');

function loadData() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { data = JSON.parse(saved); if (!data.banks) data.banks = []; if (!data.bills) data.bills = []; } catch(e) { data = { banks: [], bills: [] }; }
  } else {
    var oldKeys = ['monthly_bank_data_v3', 'monthly_bank_data_v2', 'monthly_bank_data'];
    for (var k = 0; k < oldKeys.length; k++) {
      var oldData = localStorage.getItem(oldKeys[k]);
      if (oldData) { try { data = JSON.parse(oldData); if (!data.banks) data.banks = []; if (!data.bills) data.bills = []; break; } catch(e) {} }
    }
  }
  nextBankId = 1; for (var i = 0; i < data.banks.length; i++) { if (data.banks[i].id >= nextBankId) nextBankId = data.banks[i].id + 1; }
  nextBillId = 1; for (var i = 0; i < data.bills.length; i++) { if (data.bills[i].id >= nextBillId) nextBillId = data.bills[i].id + 1; }
  var savedExpanded = localStorage.getItem('expandedBanks_v4');
  expandedBanks = savedExpanded ? (function(){ try { return JSON.parse(savedExpanded); } catch(e) { return {}; } })() : {};
}

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function saveExpandedState() { localStorage.setItem('expandedBanks_v4', JSON.stringify(expandedBanks)); }

var toastTimer;
function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1800); }

var modalResolve = null;
function showModal(message, options) {
  options = options || {};
  return new Promise(function(resolve) {
    modalResolve = resolve; modalMessage.textContent = message; modalIcon.textContent = options.icon || '⚠️';
    modalConfirm.className = 'btn confirm-btn' + (options.confirmClass ? ' ' + options.confirmClass : '');
    modalConfirm.textContent = options.confirmText || '确认'; modalCancel.textContent = options.cancelText || '取消';
    modalCancel.style.display = options.showCancel === false ? 'none' : ''; modalOverlay.classList.add('show');
  });
}
function hideModal(result) { modalOverlay.classList.remove('show'); if (modalResolve) { modalResolve(result); modalResolve = null; } }
modalConfirm.onclick = function() { hideModal(true); };
modalCancel.onclick = function() { hideModal(false); };
modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) hideModal(false); });

statusSelectDisplay.addEventListener('click', function(e) {
  e.stopPropagation(); var isOpen = statusSelectDropdown.classList.contains('open');
  if (!isOpen) { statusSelectDropdown.classList.add('open'); statusSelectDisplay.classList.add('open'); }
  else { statusSelectDropdown.classList.remove('open'); statusSelectDisplay.classList.remove('open'); }
});
for (var s = 0; s < statusOptions.length; s++) {
  statusOptions[s].addEventListener('click', function(e) {
    e.stopPropagation(); for (var i = 0; i < statusOptions.length; i++) statusOptions[i].classList.remove('selected');
    this.classList.add('selected'); statusSelectText.textContent = this.textContent; currentBillStatus = this.dataset.value;
    statusSelectDropdown.classList.remove('open'); statusSelectDisplay.classList.remove('open');
  });
}
document.addEventListener('click', function() { statusSelectDropdown.classList.remove('open'); statusSelectDisplay.classList.remove('open'); });
function setStatusValue(value) {
  currentBillStatus = value;
  for (var i = 0; i < statusOptions.length; i++) { statusOptions[i].classList.remove('selected'); if (statusOptions[i].dataset.value === value) { statusOptions[i].classList.add('selected'); statusSelectText.textContent = statusOptions[i].textContent; } }
}

function openBankForm() { bankFormOverlay.classList.add('show'); setTimeout(function() { bankNameInput.focus(); }, 150); }
function closeBankForm() { bankFormOverlay.classList.remove('show'); editingBankId = null; }
bankFormOverlay.addEventListener('click', function(e) { if (e.target === bankFormOverlay) closeBankForm(); });
bankCancelBtn.onclick = closeBankForm;
bankSaveBtn.onclick = function() {
  var name = bankNameInput.value.trim();
  if (!name) { showToast('请输入银行名称'); return; }
  if (editingBankId) { for (var i = 0; i < data.banks.length; i++) { if (data.banks[i].id === editingBankId) { data.banks[i].name = name; break; } } }
  else { data.banks.push({ id: nextBankId, name: name }); expandedBanks[nextBankId] = true; saveExpandedState(); nextBankId++; }
  saveData(); editingBankId = null; bankNameInput.value = ''; closeBankForm(); showToast('银行已保存'); render();
};

function openBillForm(bankId) { currentBankId = bankId; billFormOverlay.classList.add('show'); setTimeout(function() { billNameInput.focus(); }, 150); }
function closeBillForm() { billFormOverlay.classList.remove('show'); editingBillId = null; currentBankId = null; }
billFormOverlay.addEventListener('click', function(e) { if (e.target === billFormOverlay) closeBillForm(); });
billCancelBtn.onclick = closeBillForm;
billSaveBtn.onclick = function() {
  var name = billNameInput.value.trim(), amount = billAmountInput.value;
  if (!name) { showToast('请输入费用名称'); return; }
  if (!amount || parseFloat(amount) < 0) { showToast('请输入有效金额'); return; }
  var finalDate;
  if (editingBillId) { for (var i = 0; i < data.bills.length; i++) { if (data.bills[i].id === editingBillId) { finalDate = data.bills[i].date || ''; break; } } }
  else { var now = new Date(); finalDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'); }
  if (editingBillId) { for (var i = 0; i < data.bills.length; i++) { if (data.bills[i].id === editingBillId) { data.bills[i].name = name; data.bills[i].amount = parseFloat(amount).toFixed(2); data.bills[i].status = currentBillStatus; data.bills[i].date = finalDate; break; } } }
  else { data.bills.push({ id: nextBillId, bankId: currentBankId, name: name, amount: parseFloat(amount).toFixed(2), date: finalDate, status: currentBillStatus }); nextBillId++; }
  saveData(); editingBillId = null; currentBankId = null; billNameInput.value = ''; billAmountInput.value = ''; closeBillForm(); showToast('已保存'); render();
};

function updateSummary() {
  var unpaidTotal = 0, paidTotal = 0, unpaidCount = 0, paidCount = 0;
  for (var i = 0; i < data.bills.length; i++) { var bill = data.bills[i], amount = parseFloat(bill.amount) || 0; if (bill.status === 'unpaid') { unpaidTotal += amount; unpaidCount++; } else { paidTotal += amount; paidCount++; } }
  document.getElementById('unpaidAmount').textContent = 'RM ' + unpaidTotal.toFixed(2); document.getElementById('unpaidCount').textContent = unpaidCount;
  document.getElementById('paidAmount').textContent = 'RM ' + paidTotal.toFixed(2); document.getElementById('paidCount').textContent = paidCount;
}
function escapeHtml(str) { if (!str) return ''; var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function deleteBank(bankId, bankName) {
  showModal('确定删除「' + bankName + '」及其所有 ' + data.bills.filter(function(b){return b.bankId===bankId;}).length + ' 条缴费事项吗？', { icon: '🗑️', confirmText: '确认删除', cancelText: '取消' }).then(function(ok) {
    if (!ok) return;
    data.banks = data.banks.filter(function(b){return b.id!==bankId;});
    data.bills = data.bills.filter(function(b){return b.bankId!==bankId;});
    delete expandedBanks[bankId]; saveExpandedState(); saveData(); showToast('「' + bankName + '」已删除'); render();
  });
}

function render() {
  listEl.innerHTML = '';
  if (!data.banks || data.banks.length === 0) { listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏦</div><div class="empty-state-text">暂无银行</div><div class="empty-state-hint">点击 ＋ 添加银行分类</div></div>'; updateSummary(); return; }

  for (var bi = 0; bi < data.banks.length; bi++) {
    var bank = data.banks[bi], bankBills = [], bankTotal = 0, bankPaidCount = 0, bankUnpaidCount = 0;
    for (var j = 0; j < data.bills.length; j++) { if (data.bills[j].bankId === bank.id) { bankBills.push(data.bills[j]); bankTotal += parseFloat(data.bills[j].amount) || 0; if (data.bills[j].status === 'paid') bankPaidCount++; else bankUnpaidCount++; } }

    var isExpanded = expandedBanks[bank.id] !== false;
    var el = document.createElement('div'); el.className = 'bank-group' + (isExpanded ? ' expanded' : ''); el.dataset.bankId = bank.id; el.draggable = false;

    var statusStatsHtml = bankBills.length > 0 ? '<span class="stat-paid">' + bankPaidCount + ' 已缴</span><span class="stat-unpaid">' + bankUnpaidCount + ' 未缴</span>' : '<span style="font-size:0.68rem;opacity:0.4;">暂无账单</span>';

    var billsHtml = '';
    for (var m = 0; m < bankBills.length; m++) {
      var b = bankBills[m], today = new Date().toISOString().split('T')[0], isOverdue = b.status === 'unpaid' && b.date && b.date < today;
      billsHtml += '<div class="bill-item' + (isOverdue ? ' overdue' : '') + '" data-bill-id="' + b.id + '" draggable="false">' +
        '<span class="bill-handle">☰</span><div class="bill-info"><div class="bill-name">' + escapeHtml(b.name) +
        '<span class="status-badge ' + (b.status === 'paid' ? 'paid' : 'unpaid') + '">' + (b.status === 'paid' ? '已缴' : '未缴') + '</span>' +
        (isOverdue ? ' ⚠' : '') + '</div><div class="bill-amount">RM ' + parseFloat(b.amount).toFixed(2) + '</div></div>' +
        '<div class="bill-actions"><button class="icon-btn toggle-paid" data-bill-id="' + b.id + '"><div class="icon-dot' + (b.status === 'paid' ? ' paid' : ' unpaid') + '"></div></button>' +
        '<button class="icon-btn edit-bill" data-bill-id="' + b.id + '"><div class="icon-edit"></div></button>' +
        '<button class="icon-btn del-bill" data-bill-id="' + b.id + '"><div class="icon-del"></div></button></div></div>';
    }
    if (bankBills.length === 0) billsHtml += '<div class="empty-bank-hint">暂无缴款事项</div>';
    billsHtml += '<div class="bank-items-footer"><div class="add-bill-btn" style="flex:2;" data-bank-id="' + bank.id + '">＋ 添加缴款事项</div>' +
      '<button class="btn-delete-bank" data-bank-id="' + bank.id + '" data-bank-name="' + escapeHtml(bank.name) + '">🗑 删除此分类</button></div>';

    el.innerHTML = '<div class="bank-header"><div class="bank-header-main"><span class="bank-handle">☰</span><span class="bank-icon">🏦</span>' +
      '<div class="bank-header-info"><div class="bank-name-row"><span class="bank-name">' + escapeHtml(bank.name) + '</span><span class="bank-total">RM ' + bankTotal.toFixed(2) + '</span></div>' +
      '<div class="bank-status-stats">' + statusStatsHtml + '</div></div></div>' +
      '<div class="bank-header-actions"><span class="collapse-arrow">▼</span></div></div>' +
      '<div class="bank-body"><div class="bank-items">' + billsHtml + '</div></div>';

    (function(bankId, bankName) {
      el.querySelector('.bank-header').onclick = function(e) { if (e.target.closest('.bank-handle')) return; expandedBanks[bankId] = !expandedBanks[bankId]; saveExpandedState(); render(); };
      var delBankBtn = el.querySelector('.btn-delete-bank'); if (delBankBtn) delBankBtn.onclick = function(e) { e.stopPropagation(); deleteBank(bankId, bankName); };
      var addBillBtn = el.querySelector('.add-bill-btn'); if (addBillBtn) addBillBtn.onclick = function(e) { e.stopPropagation(); editingBillId = null; billNameInput.value = ''; billAmountInput.value = ''; setStatusValue('unpaid'); openBillForm(bankId); };
      el.querySelectorAll('.toggle-paid').forEach(function(btn){ btn.onclick = function(e){ e.stopPropagation(); var bid = parseInt(this.dataset.billId); for (var i = 0; i < data.bills.length; i++) { if (data.bills[i].id === bid) { data.bills[i].status = data.bills[i].status === 'paid' ? 'unpaid' : 'paid'; break; } } saveData(); render(); }; });
      el.querySelectorAll('.edit-bill').forEach(function(btn){ btn.onclick = function(e){ e.stopPropagation(); var bid = parseInt(this.dataset.billId), bl = data.bills.find(function(x){return x.id===bid;}); if (!bl) return; editingBillId = bid; billNameInput.value = bl.name; billAmountInput.value = bl.amount; setStatusValue(bl.status || 'unpaid'); openBillForm(bl.bankId); }; });
      el.querySelectorAll('.del-bill').forEach(function(btn){ btn.onclick = function(e){ e.stopPropagation(); var bid = parseInt(this.dataset.billId), bl = data.bills.find(function(x){return x.id===bid;}); if (!bl) return; showModal('确定删除「' + bl.name + '」吗？', { icon: '🗑️', confirmText: '删除', cancelText: '取消' }).then(function(ok){ if (!ok) return; data.bills = data.bills.filter(function(x){return x.id!==bid;}); saveData(); showToast('已删除'); render(); }); }; });
      el.querySelectorAll('.bill-handle, .bank-handle').forEach(function(h){ h.addEventListener('touchstart', handleTouchStart, { passive: false }); });
    })(bank.id, bank.name);
    listEl.appendChild(el);
  }

  listEl.querySelectorAll('.bill-item').forEach(function(item){ item.addEventListener('dragstart', handleBillDragStart); item.addEventListener('dragover', handleBillDragOver); item.addEventListener('drop', handleBillDrop); item.addEventListener('dragend', handleDragEnd); item.setAttribute('draggable', 'true'); });
  listEl.querySelectorAll('.bank-group').forEach(function(group){ group.addEventListener('dragstart', handleBankDragStart); group.addEventListener('dragover', handleBankDragOver); group.addEventListener('drop', handleBankDrop); group.addEventListener('dragend', handleDragEnd); group.setAttribute('draggable', 'true'); });
  updateSummary();
}

function handleBankDragStart(e) { var g = e.target.closest('.bank-group'); if (!g || !e.target.closest('.bank-handle')) { e.preventDefault(); return; } e.stopPropagation(); draggedItem = g; draggedItemType = 'bank'; draggedItemId = parseInt(g.dataset.bankId); dragOverItem = null; g.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function handleBankDragOver(e) { e.preventDefault(); e.stopPropagation(); var g = e.target.closest('.bank-group'); if (!g || !draggedItem || draggedItemType !== 'bank' || g === draggedItem) return; if (dragOverItem) dragOverItem.classList.remove('drag-over'); dragOverItem = g; g.classList.add('drag-over'); }
function handleBankDrop(e) { e.preventDefault(); e.stopPropagation(); if (!draggedItem || draggedItemType !== 'bank') return; if (dragOverItem) dragOverItem.classList.remove('drag-over'); draggedItem.classList.remove('dragging'); if (!dragOverItem || dragOverItem === draggedItem) { resetDragState(); return; } var fi = -1, ti = -1; for (var i = 0; i < data.banks.length; i++) { if (data.banks[i].id === draggedItemId) fi = i; if (data.banks[i].id === parseInt(dragOverItem.dataset.bankId)) ti = i; } if (fi >= 0 && ti >= 0 && fi !== ti) { data.banks.splice(ti, 0, data.banks.splice(fi, 1)[0]); saveData(); showToast('已调整顺序'); } resetDragState(); render(); }
function handleBillDragStart(e) { var item = e.target.closest('.bill-item'); if (!item || !e.target.closest('.bill-handle')) { e.preventDefault(); return; } e.stopPropagation(); draggedItem = item; draggedItemType = 'bill'; draggedItemId = parseInt(item.dataset.billId); var bg = item.closest('.bank-group'); draggedItemBankId = bg ? parseInt(bg.dataset.bankId) : null; dragOverItem = null; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function handleBillDragOver(e) { e.preventDefault(); e.stopPropagation(); var item = e.target.closest('.bill-item'); if (!item || !draggedItem || draggedItemType !== 'bill' || item === draggedItem) return; var tbg = item.closest('.bank-group'); if (parseInt(tbg?.dataset?.bankId) !== draggedItemBankId) return; if (dragOverItem) dragOverItem.classList.remove('drag-over'); dragOverItem = item; item.classList.add('drag-over'); }
function handleBillDrop(e) { e.preventDefault(); e.stopPropagation(); if (!draggedItem || draggedItemType !== 'bill') return; if (dragOverItem) dragOverItem.classList.remove('drag-over'); draggedItem.classList.remove('dragging'); if (!dragOverItem || dragOverItem === draggedItem) { resetDragState(); return; } var bb = data.bills.filter(function(x){return x.bankId===draggedItemBankId;}); var fi = bb.findIndex(function(x){return x.id===draggedItemId;}), ti = bb.findIndex(function(x){return x.id===parseInt(dragOverItem.dataset.billId);}); if (fi >= 0 && ti >= 0 && fi !== ti) { bb.splice(ti, 0, bb.splice(fi, 1)[0]); data.bills = data.bills.filter(function(x){return x.bankId!==draggedItemBankId;}).concat(bb); saveData(); showToast('已调整顺序'); } resetDragState(); render(); }
function handleDragEnd() { if (draggedItem) draggedItem.classList.remove('dragging'); if (dragOverItem) dragOverItem.classList.remove('drag-over'); resetDragState(); }
function resetDragState() { draggedItem = null; draggedItemType = null; draggedItemId = null; draggedItemBankId = null; dragOverItem = null; }

function handleTouchStart(e) {
  var t = e.target, bh = t.closest('.bill-handle'), kh = t.closest('.bank-handle');
  if (bh) { var bi = bh.closest('.bill-item'); if (!bi) return; var bg = bi.closest('.bank-group'); touchDraggedItem = bi; touchDraggedItemType = 'bill'; touchDraggedItemId = parseInt(bi.dataset.billId); touchDraggedItemBankId = bg ? parseInt(bg.dataset.bankId) : null; touchStartElement = bh; touchHasMoved = false; touchStartY = e.touches[0].clientY; touchStartX = e.touches[0].clientX; }
  else if (kh) { var bg = kh.closest('.bank-group'); if (!bg) return; touchDraggedItem = bg; touchDraggedItemType = 'bank'; touchDraggedItemId = parseInt(bg.dataset.bankId); touchStartElement = kh; touchHasMoved = false; touchStartY = e.touches[0].clientY; touchStartX = e.touches[0].clientX; }
}
function handleTouchMove(e) {
  if (!touchDraggedItem || !touchStartElement) return;
  if (Math.abs(e.touches[0].clientY - touchStartY) > 8 || Math.abs(e.touches[0].clientX - touchStartX) > 8) {
    touchHasMoved = true; e.preventDefault();
    if (!touchClone) { touchDraggedItem.classList.add('dragging'); touchClone = touchDraggedItem.cloneNode(true); touchClone.style.cssText = 'position:fixed;z-index:1000;opacity:0.8;pointer-events:none;width:' + touchDraggedItem.offsetWidth + 'px;'; touchClone.style.left = touchDraggedItem.getBoundingClientRect().left + 'px'; document.body.appendChild(touchClone); }
    if (touchClone) touchClone.style.top = (e.touches[0].clientY - 30) + 'px';
    var elBelow = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    if (dragOverItem) { dragOverItem.classList.remove('drag-over'); dragOverItem = null; }
    if (touchDraggedItemType === 'bill') { var bBelow = elBelow ? elBelow.closest('.bill-item') : null; if (bBelow && bBelow !== touchDraggedItem && parseInt(bBelow.closest('.bank-group')?.dataset?.bankId) === touchDraggedItemBankId) { dragOverItem = bBelow; bBelow.classList.add('drag-over'); } }
    else if (touchDraggedItemType === 'bank') { var gBelow = elBelow ? elBelow.closest('.bank-group') : null; if (gBelow && gBelow !== touchDraggedItem) { dragOverItem = gBelow; gBelow.classList.add('drag-over'); } }
  }
}
function handleTouchEnd() {
  if (!touchDraggedItem) return;
  if (touchClone) { document.body.removeChild(touchClone); touchClone = null; }
  touchDraggedItem.classList.remove('dragging'); if (dragOverItem) dragOverItem.classList.remove('drag-over');
  if (touchHasMoved && dragOverItem && dragOverItem !== touchDraggedItem) {
    if (touchDraggedItemType === 'bank') { var fi = data.banks.findIndex(function(x){return x.id===touchDraggedItemId;}), ti = data.banks.findIndex(function(x){return x.id===parseInt(dragOverItem.dataset.bankId);}); if (fi >= 0 && ti >= 0 && fi !== ti) { data.banks.splice(ti, 0, data.banks.splice(fi, 1)[0]); saveData(); showToast('已调整顺序'); } }
    else if (touchDraggedItemType === 'bill') { var bb = data.bills.filter(function(x){return x.bankId===touchDraggedItemBankId;}); var fi = bb.findIndex(function(x){return x.id===touchDraggedItemId;}), ti = bb.findIndex(function(x){return x.id===parseInt(dragOverItem.dataset.billId);}); if (fi >= 0 && ti >= 0 && fi !== ti) { bb.splice(ti, 0, bb.splice(fi, 1)[0]); data.bills = data.bills.filter(function(x){return x.bankId!==touchDraggedItemBankId;}).concat(bb); saveData(); showToast('已调整顺序'); } }
    render();
  }
  resetDragState(); touchDraggedItem = null; touchDraggedItemType = null; touchDraggedItemId = null; touchDraggedItemBankId = null; touchStartElement = null; touchHasMoved = false;
}

document.addEventListener('touchmove', function(e) { if (touchDraggedItem) handleTouchMove(e); }, { passive: false });
document.addEventListener('touchend', function() { if (touchDraggedItem) handleTouchEnd(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { if (modalOverlay.classList.contains('show')) hideModal(false); else if (billFormOverlay.classList.contains('show')) closeBillForm(); else if (bankFormOverlay.classList.contains('show')) closeBankForm(); else if (menuOverlay.classList.contains('show')) menuOverlay.classList.remove('show'); else if (tutorialOverlay.classList.contains('show')) tutorialOverlay.classList.remove('show'); } });

var deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex'; });
installBtn.addEventListener('click', async function() { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.style.display = 'none'; } });

function showTutorial() { document.getElementById('tutorialContent').innerHTML = '<div style="background:#4285f4;color:#fff;padding:4px 10px;border-radius:10px;display:inline-block;font-size:0.75rem;margin-bottom:8px;">📱 安装教程</div><div style="display:flex;gap:10px;padding:8px 0;"><div style="width:28px;height:28px;background:#2c3e50;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;">1</div><div>点击菜单 <strong>⋮</strong></div></div><div style="display:flex;gap:10px;padding:8px 0;"><div style="width:28px;height:28px;background:#2c3e50;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;">2</div><div>选择 <strong>「添加到主屏幕」</strong></div></div><div style="display:flex;gap:10px;padding:8px 0;"><div style="width:28px;height:28px;background:#2c3e50;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;">3</div><div>点击 <strong>「安装」</strong></div></div>'; tutorialOverlay.classList.add('show'); }

loadData(); render();
</script>
